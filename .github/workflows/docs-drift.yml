name: Docs drift

on:
  pull_request:

permissions:
  contents: read

jobs:
  docs-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - name: Install doc-drift-checker
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install github.com/JtheGunner/doc-drift-checker/cmd/doc-drift-checker@v0.2.3
      - name: Check documentation drift
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          "$RUNNER_TEMP/bin/doc-drift-checker" check --base "origin/${BASE_REF}" --format github --warn-only
